name: Build mipsel easytier-web-embed

on:
  workflow_dispatch:

env:
  TARGET: mipsel-unknown-linux-musl
  MUSL_TARGET: mipsel-unknown-linux-muslsf
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qqy build-essential musl-tools file

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          components: rust-src
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ''

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install and build frontend
        run: |
          pnpm -r install
          pnpm -r --workspace-concurrency=1 --filter "./easytier-web/*" build
          if [ -f easytier-web/frontend/dist/index.html ] && [ -f easytier-web/config-generator/dist/index.html ]; then
            mkdir -p easytier-web/frontend/dist/config-generator
            cp -R easytier-web/config-generator/dist/. easytier-web/frontend/dist/config-generator/
          fi
          echo "=== Frontend dist ==="
          ls -la easytier-web/frontend/dist/

      - name: Download musl GCC toolchain
        run: |
          mkdir -p ./musl_gcc
          wget --inet4-only -q --show-progress -c https://github.com/cross-tools/musl-cross/releases/download/20250520/${MUSL_TARGET}.tar.xz -P ./musl_gcc/
          tar xf ./musl_gcc/${MUSL_TARGET}.tar.xz -C ./musl_gcc/
          # Fix ownership so we can modify files
          sudo chown -R $(whoami):$(whoami) ./musl_gcc
          chmod -R u+rw ./musl_gcc
          echo "TOOLCHAIN_DIR=$(pwd)/musl_gcc/${MUSL_TARGET}" >> $GITHUB_ENV
          echo "$(pwd)/musl_gcc/${MUSL_TARGET}/bin" >> $GITHUB_PATH

          # Prepare libunwind and libctz for panic-abort
          LIBGCC_DIR="$(pwd)/musl_gcc/${MUSL_TARGET}/lib/gcc/${MUSL_TARGET}/15.1.0"
          cd "$LIBGCC_DIR" || exit 255
          cp libgcc_eh.a libunwind.a
          ar x libgcc.a _ctzsi2.o _clz.o _bswapsi2.o || true
          ar rcs libctz.a _ctzsi2.o _clz.o _bswapsi2.o || true
          ls -la libunwind.a libctz.a
          cd "${GITHUB_WORKSPACE}"

      - name: Verify toolchain
        run: |
          which ${MUSL_TARGET}-gcc
          ${MUSL_TARGET}-gcc --version
          echo "=== Test compile ==="
          echo 'int main(){return 0;}' > /tmp/test.c
          ${MUSL_TARGET}-gcc -static /tmp/test.c -o /tmp/test && echo "GCC works"
          file /tmp/test

      - name: Patch cargo config for absolute paths
        run: |
          # Replace relative musl_gcc paths with absolute paths in .cargo/config.toml
          sed -i "s|\./musl_gcc|${GITHUB_WORKSPACE}/musl_gcc|g" .cargo/config.toml
          echo "=== Patched mipsel config ==="
          grep -A 20 "target.mipsel-unknown-linux-musl" .cargo/config.toml

      - name: Build easytier-web (embed)
        env:
          RUSTC_BOOTSTRAP: 1
          CC_mipsel_unknown_linux_musl: ${{ github.workspace }}/musl_gcc/mipsel-unknown-linux-muslsf/bin/mipsel-unknown-linux-muslsf-gcc
          CXX_mipsel_unknown_linux_musl: ${{ github.workspace }}/musl_gcc/mipsel-unknown-linux-muslsf/bin/mipsel-unknown-linux-muslsf-g++
          AR_mipsel_unknown_linux_musl: ${{ github.workspace }}/musl_gcc/mipsel-unknown-linux-muslsf/bin/mipsel-unknown-linux-muslsf-ar
        run: |
          set -o pipefail
          cargo build -r \
            --target $TARGET \
            -Z build-std=std,panic_abort \
            --package=easytier-web \
            --features=embed 2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log || true
          echo ""
          echo "=== Search for error keywords ==="
          grep -i -E "error|cannot|failed|unsupported|undefined reference|linker" build.log | tail -50 || true

      - name: Verify binary
        run: |
          ls -lh ./target/$TARGET/release/easytier-web
          file ./target/$TARGET/release/easytier-web

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: easytier-web-embed-mipsel
          path: ./target/${{ env.TARGET }}/release/easytier-web

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
